<!DOCTYPE html>

<html>

<head>

    <title>Marks Calculator</title>

    <style>

        /* Remove default spacing */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Whole page */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* Main card */
        .calculate {
            background: white;

            width: 500px;

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }


        /* Card hover */
        .calculate:hover {
            transform: translateY(-5px);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }


        /* Heading */
        h1 {
            text-align: center;

            margin-bottom: 30px;

            color: #333;

            font-size: 28px;
        }


        /* Each subject */
        .subject {
            margin-bottom: 25px;
        }


        /* Subject label */
        label {
            display: block;

            margin-bottom: 10px;

            font-weight: bold;

            color: #444;
        }


        /* Text box */
        .marks-input {
            width: 70px;

            padding: 10px;

            border: 2px solid #ddd;

            border-radius: 8px;

            font-size: 16px;

            text-align: center;

            transition: border-color 0.3s,
                        box-shadow 0.3s;
        }


        /* Text box when clicked */
        .marks-input:focus {
            outline: none;

            border-color: #667eea;

            box-shadow: 0 0 8px rgba(102, 126, 234, 0.4);
        }


        /* Slider */
        .slider {
            width: 100%;

            margin-top: 12px;

            cursor: pointer;

            accent-color: #667eea;
        }


        /* Slider hover */
        .slider:hover {
            accent-color: #764ba2;
        }


        /* Button */
        .button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: transform 0.2s,
                        box-shadow 0.2s;
        }


        /* Button hover */
        .button:hover {
            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }


        /* Button click */
        .button:active {
            transform: translateY(1px);
        }


        /* Result */
        .result {
            margin-top: 25px;

            padding: 15px;

            text-align: center;

            background: #f3f4ff;

            border-radius: 10px;

            color: #444;

            font-size: 18px;
        }


        /* Result number */
        .result span {
            color: #667eea;

            font-weight: bold;

            font-size: 22px;
        }


        /* Mobile */
        @media (max-width: 600px) {

            .calculate {
                width: 90%;

                padding: 25px;
            }

        }

    </style>

</head>


<body>

    <div class="calculate">

        <h1>Calculate Average Marks</h1>


        <form action="{{ url_for('form') }}" method="post">


            <!-- Maths -->

<div class="subject">

    <label>Maths Marks</label>

    <input
        type="number"
        id="mathsValue"
        name="maths"
        value="{{ maths|default(50) }}"
        min="0"
        max="100"
        class="marks-input"
        oninput="mathsSlider.value = this.value"
    >

    <input
        type="range"
        id="mathsSlider"
        min="0"
        max="100"
        value="{{ maths|default(50) }}"
        class="slider"
        oninput="mathsValue.value = this.value"
    >

</div>


<!-- Science -->
<div class="subject">

    <label>Science Marks</label>

    <input
        type="number"
        id="scienceValue"
        name="science"
        value="{{ science|default(50) }}"
        min="0"
        max="100"
        class="marks-input"
        oninput="scienceSlider.value = this.value"
    >

    <input
        type="range"
        id="scienceSlider"
        min="0"
        max="100"
        value="{{ science|default(50) }}"
        class="slider"
        oninput="scienceValue.value = this.value"
    >

</div>


<!-- Kannada -->
<div class="subject">

    <label>Kannada Marks</label>

    <input
        type="text"
        id="kannadaValue"
        name="kannada"
        value="{{ kannada|default(50) }}"
        min="0"
        max="100"
        class="marks-input"
        oninput="kannadaSlider.value = this.value"
    >

    <input
        type="range"
        id="kannadaSlider"
        min="0"
        max="100"
        value="{{ kannada|default(50) }}"
        class="slider"
        oninput="kannadaValue.value = this.value"
    >

</div>


            <button type="submit" class="button">
                Calculate Average
            </button>

        </form>


        <div class="result">

            The average marks obtained:

            <span>{{ average_marks }}</span>

        </div>

    </div>

</body>

</html>
